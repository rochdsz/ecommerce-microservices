services:
  # ---------------------------------------------
  # 1. API GATEWAY
  # ---------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: micro_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - user_service
      - product_service
      - inventory_service
      - order_service
      - payment_service

  # ---------------------------------------------
  # 2. APPLICATION SERVICES
  # ---------------------------------------------
  user_service:
    build: ./services/user_service
    container_name: micro_user_service
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@users_db:3306/users_db
      - SECRET_KEY=shared_microservices_jwt_secret_key_12345
    depends_on:
      users_db:
        condition: service_healthy

  product_service:
    build: ./services/product_service
    container_name: micro_product_service
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@products_db:3306/products_db
    depends_on:
      products_db:
        condition: service_healthy

  inventory_service:
    build: ./services/inventory_service
    container_name: micro_inventory_service
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@inventory_db:3306/inventory_db
    depends_on:
      inventory_db:
        condition: service_healthy

  order_service:
    build: ./services/order_service
    container_name: micro_order_service
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@orders_db:3306/orders_db
      - SECRET_KEY=shared_microservices_jwt_secret_key_12345
      - PRODUCT_SERVICE_URL=http://product_service:8000
      - INVENTORY_SERVICE_URL=http://inventory_service:8000
      - PAYMENT_SERVICE_URL=http://payment_service:8000
    depends_on:
      orders_db:
        condition: service_healthy
      product_service:
        condition: service_started
      inventory_service:
        condition: service_started
      payment_service:
        condition: service_started

  payment_service:
    build: ./services/payment_service
    container_name: micro_payment_service
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword@payments_db:3306/payments_db
    depends_on:
      payments_db:
        condition: service_healthy

  # ---------------------------------------------
  # 3. DATABASES (Database-per-Service)
  # ---------------------------------------------
  users_db:
    image: mysql:8.0
    container_name: micro_users_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: users_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - users_db_data:/var/lib/mysql

  products_db:
    image: mysql:8.0
    container_name: micro_products_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: products_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - products_db_data:/var/lib/mysql

  inventory_db:
    image: mysql:8.0
    container_name: micro_inventory_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - inventory_db_data:/var/lib/mysql

  orders_db:
    image: mysql:8.0
    container_name: micro_orders_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: orders_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - orders_db_data:/var/lib/mysql

  payments_db:
    image: mysql:8.0
    container_name: micro_payments_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: payments_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payments_db_data:/var/lib/mysql

volumes:
  users_db_data:
  products_db_data:
  inventory_db_data:
  orders_db_data:
  payments_db_data: